<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Recovery Heatmap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  :root {
    --bg: #F7F7F7; --surface: #ffffff; --border: #e0e0e0;
    --text: #242424; --muted: #999; --font: 'Inter', sans-serif;
    --green-hi: #AEEB59; --red-hi: #F85858;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: var(--font); font-size: 11px; color: var(--text); padding: 10px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  .header { margin-bottom: 8px; flex-shrink: 0; }
  .title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }

  .legend-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .legend-label { font-size: 9px; color: var(--muted); }
  .legend-bar { display: flex; height: 8px; width: 160px; border-radius: 1px; overflow: hidden; }
  .legend-bar-fill { flex: 1; }

  .table-wrap { flex: 1; overflow: auto; }
  table { border-collapse: collapse; font-size: 10px; white-space: nowrap; }

  /* Sticky FY column */
  th.fy-col, td.fy-col { position: sticky; left: 0; z-index: 2; background: #242424; color: #fff; font-weight: 700; padding: 5px 10px; text-align: left; border-right: 2px solid #555; min-width: 60px; }
  th.fy-col { z-index: 3; background: #111; }

  /* Month header */
  th.month-col { background: #242424; color: #fff; font-size: 9px; font-weight: 500; padding: 5px 6px; text-align: center; border-right: 1px solid #333; white-space: nowrap; min-width: 52px; position: sticky; top: 0; z-index: 1; }
  th.month-col.cur-fy { background: #3a3a3a; }

  /* Data cells */
  td.cell { text-align: center; padding: 4px 6px; border-right: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 10px; font-weight: 500; min-width: 52px; cursor: default; transition: filter 0.1s; }
  td.cell:hover { filter: brightness(1.1); }
  td.cell.empty { background: #f0f0f0; color: var(--muted); }
  tr:last-child td { border-bottom: none; }

  .no-data { text-align: center; padding: 40px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="header">
  <div class="title">Monthly Recovery Performance — All Claims (excl. Intervention)</div>
  <div class="legend-row">
    <div class="legend-bar" id="legend-bar"></div>
    <span class="legend-label" id="legend-range" style="margin-left:8px;"></span>
  </div>
</div>

<div class="table-wrap">
  <div id="table-container"><div class="no-data">Waiting for data…</div></div>
</div>

<script>
function getParams() {
  const fullHref = decodeURIComponent(location.href);
  const hashIdx = fullHref.indexOf('#');
  return hashIdx >= 0 ? fullHref.slice(hashIdx + 1) : '';
}

function fmtPct(v) {
  if (v === 0 || v === null || v === undefined) return '';
  return (v / 100).toFixed(1) + '%';
}

// Heatmap colour: fixed percentage bands
// 0-50 shades of red, 51-70 shades of orange, 71-89 shades of yellow, 90+ shades of green
// val is encoded as ratio × 10000, so val/100 = percentage (e.g. 5000 → 50.0%)
function cellColor(val) {
  if (val === 0) return null;
  const pct = val / 100; // convert to 0-100+ scale

  if (pct <= 50) {
    // shades of red: darker/more saturated red as pct drops toward 0
    const t = Math.max(0, Math.min(1, pct / 50)); // 0 at pct=0, 1 at pct=50
    // light red (near 50) → deep red (near 0)
    const r = 255;
    const g = Math.round(120 + (220 - 120) * t);
    const b = Math.round(120 + (220 - 120) * t);
    return `rgb(${r},${g},${b})`;
  } else if (pct <= 70) {
    // shades of orange: 51-70
    const t = Math.max(0, Math.min(1, (pct - 51) / (70 - 51)));
    const r = 255;
    const g = Math.round(170 + (210 - 170) * t);
    const b = Math.round(80  + (140 - 80)  * t);
    return `rgb(${r},${g},${b})`;
  } else if (pct <= 89) {
    // shades of yellow: 71-89
    const t = Math.max(0, Math.min(1, (pct - 71) / (89 - 71)));
    const r = Math.round(255 - (255 - 240) * t);
    const g = Math.round(235 - (235 - 220) * t);
    const b = Math.round(100 + (180 - 100) * t);
    return `rgb(${r},${g},${b})`;
  } else {
    // shades of green: 90+ (scaling toward deepest green by 150%)
    const t = Math.max(0, Math.min(1, (pct - 90) / (150 - 90)));
    const r = Math.round(220 - (220 - 130) * t);
    const g = Math.round(235 - (235 - 200) * t);
    const b = Math.round(150 - (150 - 80)  * t);
    return `rgb(${r},${g},${b})`;
  }
}

function textColor(val) {
  if (val === 0) return '';
  return '#242424';
}

function buildLegendBands() {
  const bar = document.getElementById('legend-bar');
  bar.innerHTML = '';
  const bands = [
    { label: '0-50', from: 0,  to: 50 },
    { label: '51-70', from: 51, to: 70 },
    { label: '71-89', from: 71, to: 89 },
    { label: '90+',   from: 90, to: 150 },
  ];
  bands.forEach(b => {
    const mid = (b.from + b.to) / 2;
    const div = document.createElement('div');
    div.className = 'legend-bar-fill';
    div.style.background = cellColor(mid * 100);
    div.title = b.label + '%';
    bar.appendChild(div);
  });
  document.getElementById('legend-range').textContent = 'Red 0-50% · Orange 51-70% · Yellow 71-89% · Green 90%+';
}

function render() {
  const raw = getParams();
  if (!raw) return;

  // Format: monthLabels ^ FY~row | FY~row ...
  // monthLabels = pipe-separated MMM-YY strings (first block before first ^)
  const parts = raw.split('^');
  if (parts.length < 2) return;

  const months = parts[0].split('|').filter(m => m.length > 0);

  const rows = [];
  for (let i = 1; i < parts.length; i++) {
    const tilde = parts[i].indexOf('~');
    if (tilde < 0) continue;
    const fy = parts[i].slice(0, tilde);
    const vals = parts[i].slice(tilde + 1).split('|').map(v => parseInt(v, 10) || 0);
    rows.push({ fy, vals });
  }

  if (!months.length || !rows.length) return;

  buildLegendBands();

  // Build table
  let html = '<table><thead><tr>';
  html += '<th class="fy-col">Year</th>';
  months.forEach(m => {
    html += `<th class="month-col">${m}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(({ fy, vals }) => {
    html += '<tr>';
    html += `<td class="fy-col">${fy}</td>`;
    months.forEach((_, ci) => {
      const v = vals[ci] !== undefined ? vals[ci] : 0;
      if (v === 0) {
        html += '<td class="cell empty">—</td>';
      } else {
        const bg = cellColor(v);
        const fg = textColor(v);
        html += `<td class="cell" style="background:${bg};color:${fg}" title="${fmtPct(v)}">${fmtPct(v)}</td>`;
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('table-container').innerHTML = html;
}

render();
</script>
</body>
</html>
