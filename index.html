<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Rate Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  :root {
    --bg:#F7F7F7;--surface:#fff;--border:#e0e0e0;
    --collected:#AEEB59;--target-line:#FF7F00;--perf-above:#AEEB59;--perf-below:#F85858;
    --text-primary:#242424;--text-secondary:#666;--text-muted:#999;--font:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text-primary);font-family:var(--font);font-size:11px;padding:10px;height:100%;overflow:hidden;display:flex;flex-direction:column;}
  .dashboard{width:100%;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap;flex-shrink:0;}
  .fy-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
  .fy-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);font-family:var(--font);font-size:10px;font-weight:500;padding:4px 10px;cursor:pointer;transition:all 0.15s;}
  .fy-btn.active{background:var(--collected);border-color:var(--collected);color:#242424;font-weight:700;}
  .fy-btn:hover:not(.active){border-color:var(--collected);color:var(--text-primary);}
  .filter-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;flex-shrink:0;}
  .filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);font-family:var(--font);font-size:9px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;padding:5px 10px;cursor:pointer;transition:all 0.15s;}
  .filter-btn.active{background:var(--collected);border-color:var(--collected);color:#242424;font-weight:700;}
  .filter-btn:hover:not(.active){border-color:var(--collected);color:var(--text-primary);}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;flex-shrink:0;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);padding:10px 12px;}
  .kpi.highlight{border-left-color:var(--collected);}
  .kpi.above{border-left-color:var(--collected);}
  .kpi.below{border-left-color:var(--perf-below);}
  .kpi-label{color:var(--text-muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:500;margin-bottom:4px;}
  .kpi-value{font-size:18px;font-weight:700;line-height:1;}
  .kpi-sub{color:var(--text-secondary);font-size:9px;margin-top:3px;}
  .pos{color:var(--perf-above);}.neg{color:var(--perf-below);}
  .chart-container{background:var(--surface);border:1px solid var(--border);padding:10px;margin-bottom:8px;flex-shrink:0;}
  .chart-wrapper{position:relative;height:220px;width:100%;flex-shrink:0;}
  .chart-title{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--text-secondary);text-transform:none;letter-spacing:0;}
  .legend-swatch{width:12px;height:8px;border-radius:1px;}
  .legend-line{width:16px;height:2px;border-top:2px dashed;}
  canvas{width:100%!important;display:block;}
  .pillar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex-shrink:0;}
  .pillar-card{background:var(--surface);border:1px solid var(--border);padding:10px 12px;}
  .pillar-name{font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;}
  .progress-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-secondary);margin-bottom:4px;}
  .progress-track{height:16px;background:#d0d0d0;position:relative;overflow:visible;}
  .progress-fill{height:100%;background:rgba(174,235,89,0.85);position:absolute;top:0;left:0;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);}
  .target-marker{position:absolute;top:-3px;width:2px;height:calc(100% + 6px);background:var(--target-line);z-index:2;}
  .target-marker::after{content:'T';position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--target-line);font-weight:700;}
  .pillar-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;text-align:center;}
  .pstat-val{font-size:13px;font-weight:700;}
  .pstat-lbl{font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px;font-weight:500;}
  .no-data{text-align:center;padding:40px;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;}
</style>
</head>
<body>
<div class="dashboard">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:6px;">
      <span class="fy-label">Financial Year</span>
      <div id="fy-selector" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
    </div>
  </div>
  <div class="filter-bar">
    <button class="filter-btn" onclick="setFilter('all',this)">All Pillars</button>
    <button class="filter-btn active" onclick="setFilter('abiMain',this)">ABI Mainstream</button>
    <button class="filter-btn" onclick="setFilter('abiPres',this)">ABI Prestige</button>
    <button class="filter-btn" onclick="setFilter('nonMain',this)">Non-ABI Mainstream</button>
    <button class="filter-btn" onclick="setFilter('nonPres',this)">Non-ABI Prestige</button>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Total Billed</div><div class="kpi-value" id="kpi-billed">—</div><div class="kpi-sub">Raw ABI Revenue</div></div>
    <div class="kpi highlight"><div class="kpi-label">Total Collected</div><div class="kpi-value" id="kpi-collected">—</div><div class="kpi-sub">Cash Recovered</div></div>
    <div class="kpi" id="kpi-perf-card"><div class="kpi-label">Performance</div><div class="kpi-value" id="kpi-perf">—</div><div class="kpi-sub" id="kpi-variance-sub">Recovery Rate</div></div>
    <div class="kpi"><div class="kpi-label">Target</div><div class="kpi-value" id="kpi-target">—</div><div class="kpi-sub">RRV</div></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">
      <span>Collection Rate &amp; Recovery Performance</span>
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(174,235,89,0.9)"></div>Collection %</div>
        <div class="legend-item"><div class="legend-line" style="border-color:#FF7F00"></div>Target</div>
        <div class="legend-item"><div class="legend-line" style="border-color:#242424"></div>Performance</div>
      </div>
    </div>
    <div class="chart-wrapper"><canvas id="mainChart"></canvas></div>
  </div>
  <div class="pillar-grid" id="pillar-grid"></div>
</div>
</body>
</html>
